name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  docs:
    name: Docs (lint + book)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Pin to the same version pre-commit and the justfile use, so all three
      # agree and none can drift onto a newer rule set. There are three copies
      # of this number: .pre-commit-config.yaml, the justfile's `markdownlint`,
      # and here. They were allowed to disagree once and it cost a gate.
      - run: npx --yes markdownlint-cli2@0.23.2
      # The book has to build, not merely lint: a broken SUMMARY.md entry or a
      # chapter deleted out from under it passes every markdown rule.
      - name: Install mdBook
        run: |
          curl -sSL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar xz -C /usr/local/bin mdbook
        env:
          MDBOOK_VERSION: "0.4.43"
      - run: mdbook build

  check:
    name: Pre-commit checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pre-commit
      - run: pre-commit run --all-files

  orchestrator:
    name: Orchestrator (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - working-directory: orchestrator
        # No game, no adapter, no API key: the scripted brain is the default,
        # so this lane is fast, free, and deterministic.
        run: |
          uv sync
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy
          uv run pytest

  thinker-dll:
    name: Thinker adapter (MinGW cross-compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The adapter is a fork of Thinker; build it from source so the release
      # artifact is produced on every push. No SMAC install is involved.
      - uses: actions/checkout@v4
        with:
          repository: scbrown/thinker
          ref: claude/neural-amplifier-smac-testing-uq1fcg
          path: thinker
      - name: Install the 32-bit MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential ninja-build g++-mingw-w64-i686-posix
      - name: Install CMake
        # Thinker's CMakePresets.json requires >= 3.31; don't rely on the
        # runner image's bundled CMake, which lags.
        uses: lukka/get-cmake@latest
        with:
          cmakeVersion: "3.31.6"
      - name: Build thinker.dll
        working-directory: thinker
        run: |
          cmake --preset ninja-develop
          cmake --build --preset ninja-develop
      - name: Verify the artifact is a 32-bit PE
        working-directory: thinker
        run: |
          dll=$(find build -name thinker.dll -print -quit)
          test -n "$dll" || { echo "thinker.dll was not produced"; exit 1; }
          file "$dll"
          file "$dll" | grep -q "PE32 executable (DLL)" \
            || { echo "not a 32-bit PE DLL"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: thinker-dll
          path: |
            thinker/build/**/thinker.dll
            thinker/build/**/thinker.exe
          if-no-files-found: error
