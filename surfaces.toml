# Which decision surfaces the LLM tier is allowed to decide.
#
# A surface set to false is not broken and not degraded — it is *deliberately deterministic*.
# The orchestrator returns the engine's own answer without calling the brain, and records the
# decision at `tier = "deterministic"`. That distinction is the reason this file exists rather
# than a comment somewhere: a run with half its surfaces switched off must not read as a run
# where the brain kept failing, and `degrade_rate` is measured over LLM-tier decisions only so
# the two cannot be confused.
#
# Path is `surfaces.toml` at the repo root, or wherever `NA_SURFACES_CONFIG` points.
#
# Every id must be in the frozen registry (`orchestrator/src/neural_amplifier/surfaces.py`).
# A typo is refused at load time rather than silently disabling nothing — a surface you think
# you turned off and did not is the worst outcome this file can produce.

# What an unlisted surface gets. False on purpose: 73 of 77 surfaces have never been
# instrumented, and defaulting them on would claim the brain is deciding things no adapter
# even reports.
default = false

[surfaces]
# All four apply: the brain's choice executes, validated against the engine's own availability
# tests so an illegal order is rejected rather than applied.
"base.production" = true
"faction.tech" = true
"faction.se" = true

# The one that spends something irreversibly. Left on, but this is the toggle to reach for
# first if a run starts burning reserves — `apply-hurry` refuses an unaffordable order, which
# is not the same as it being a good one.
"base.hurry" = true
