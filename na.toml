# Neural Amplifier — one config file for a run.
#
# Everything here was an `NA_*` environment variable. A run is now reproducible from something
# you can read and commit rather than from ten variables that all have to be right at once and
# leave no trace in the record when they are not.
#
# **Environment variables still win.** Precedence is env > this file > default, on purpose: the
# file is what a run *is*, and a variable is how you override one thing for one run without
# editing the tree — which is what CI and the cloud setup script do. The other order would let a
# checked-in file silently override the harness.
#
# Path is `na.toml` at the repo root, or wherever `NA_CONFIG` points. A malformed file refuses
# to start the service rather than failing one turn at a time in a running game.

[brain]
# "scripted" or "claude". Scripted by default and the real brain opt-in, because CI must never
# make a paid call by accident — that costs money and, worse, makes a test result depend on a
# model. Overrides: NA_BRAIN, NA_BRAIN_MODEL, NA_BRAIN_EFFORT.
kind = "scripted"
# model = "claude-haiku-4-5"
# effort = "medium"

[knowledge]
# The Quipu/Hank seam. All optional: absent means a less-informed decision, never a stalled
# turn. Overrides: NA_QUIPU_URL, NA_ENGINE, NA_TOKEN_BUDGET, NA_HANK_GUARD.
engine = "thinker"
# quipu_url = "http://127.0.0.1:3030"
# Approximate token ceiling for grounding, 0 to disable. Bounding the fact count alone says
# nothing about prompt size when one fact is a paragraph.
token_budget = 0
# Citation integrity. On whenever retrieval is: it needs no service, never denies, and without
# it a fabricated or unread citation is invisible.
guard = true

[run]
# Where a run's evidence goes. A record nobody keeps cannot be replayed or measured.
# Overrides: NA_DECISION_LOG, NA_WORLD_VIEW_STORE, NA_PLAN, NA_OTEL.
# decision_log = "decisions.jsonl"
# world_view_store = "worldviews"
# plan = "plan.json"
otel = false

# ---------------------------------------------------------------------------
# Which decision surfaces the LLM tier is allowed to decide.
#
# A surface set to false is not broken and not degraded — it is *deliberately deterministic*.
# The orchestrator returns the engine's own answer without calling the brain and records the
# decision at `tier = "deterministic"`. That distinction is why this exists rather than being a
# comment somewhere: a run with half its surfaces switched off must not read as a run where the
# brain kept failing, and `degrade_rate` is measured over LLM-tier decisions only so the two
# cannot be confused.
#
# Every id must be in the frozen registry (`orchestrator/src/neural_amplifier/surfaces.py`).
# A typo is refused at load rather than silently disabling nothing — a surface you think you
# turned off and did not is the worst outcome this file can produce.

# What an unlisted surface gets. False on purpose: 73 of 77 surfaces have never been
# instrumented, and defaulting them on would claim the brain is deciding things no adapter
# even reports.
surface_default = false

[surfaces]
# Whether the brain is *asked*. Only `base.production` currently applies the answer — the
# adapter exports no decide entry point for the other three, so they emit a record and the
# engine still chooses regardless of the toggle. Kept on so the decision is exercised and
# recorded now, and so these become live the moment an apply path lands rather than needing
# a config change nobody remembers to make.
#
# base.production's choice executes, validated against the engine's own availability tests so
# an illegal order is rejected rather than applied.
"base.production" = true
"faction.tech" = true
"faction.se" = true

# The one that would spend something irreversibly once it applies. Left on, but this is the
# toggle to reach for first if a run starts burning reserves.
"base.hurry" = true
