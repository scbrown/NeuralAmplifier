[project]
name = "neural-amplifier"
version = "0.1.0"
description = "An LLM brain for Sid Meier's Alpha Centauri — the platform-agnostic orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The real Claude brain. Tests run against the scripted brain and never need this.
claude = ["anthropic>=0.40"]

[project.scripts]
neural-amplifier = "neural_amplifier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_amplifier"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["neural_amplifier"]
mypy_path = "src"
strict = true
# FastAPI decorators are untyped in some versions; don't fail the gate on them.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Optional dependency behind the `claude` extra — absent in the default env.
module = ["anthropic.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
