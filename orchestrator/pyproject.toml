[project]
name = "neural-amplifier"
version = "0.1.0"
description = "An LLM brain for Sid Meier's Alpha Centauri — the platform-agnostic orchestrator"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# The real Claude brain. Tests run against the scripted brain and never need this.
claude = ["anthropic>=0.40"]
# Layer 2 of docs/observability.md. Layer 1 (JSONL) has no dependencies and
# is the record of truth; without this you lose only the live view.
otel = ["opentelemetry-sdk>=1.27"]
# The MCP surface an agent plays through (`neural-amplifier mcp`). Optional because a
# scripted or Claude-brain run never starts it; the orchestrator itself needs nothing.
mcp = ["mcp>=1.2"]

[project.scripts]
neural-amplifier = "neural_amplifier.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.9",
    "mypy>=1.11",
    # In dev so the exporter is type-checked and tested in the default lane.
    "opentelemetry-sdk>=1.27",
    # Round-trips the emitted datalinks Turtle. Emission itself has no deps;
    # this is the gate that catches invalid syntax that reads fine to a human.
    "rdflib>=7.0",
    # In dev for the same reason as opentelemetry-sdk: the MCP server is how the game is
    # actually played now, and an agent surface nobody tests is one that breaks silently
    # at the moment a session starts.
    "mcp>=1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neural_amplifier"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "UP031"]

[tool.mypy]
python_version = "3.11"
packages = ["neural_amplifier"]
mypy_path = "src"
strict = true
# FastAPI decorators are untyped in some versions; don't fail the gate on them.
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
# Optional dependency behind the `claude` extra — absent in the default env.
module = ["anthropic.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Test-only; the shipped package never imports it.
module = ["rdflib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
