repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        types: [json]
      - id: check-merge-conflict
      - id: check-added-large-files

  # Must match `markdownlint` in the justfile — see the note there.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.23.2
    hooks:
      - id: markdownlint-cli2
        args: []

  # Python (orchestrator) — manages its own env; runs only on .py files,
  # so this is a no-op until the orchestrator lands and enforcing thereafter.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [--fix]
        files: ^orchestrator/.*\.py$
      - id: ruff-format
        files: ^orchestrator/.*\.py$

  # The beads tracker is a git-tracked file written by a tool whose auto-export is GATED:
  # a second `bd` write shortly after the first does not export, exits 0, and says nothing
  # (na-2a9, measured). A stale export is a well-formed file with the right id count and
  # the wrong field values, so review cannot see it — this hook can.
  #
  # Check-only: it never writes during a commit. `just beads-export` is the fix, and it
  # refuses to install an export that loses work relative to HEAD.
  - repo: local
    hooks:
      - id: beads-export-current
        name: beads export is current
        entry: scripts/beads-export.py --check
        language: system
        files: ^\.beads/issues\.jsonl$
        pass_filenames: false
